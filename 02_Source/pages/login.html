<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Bienvenido a MusicAI!</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-screen">
      <div class="decorative-bg" aria-hidden="true">
        <span class="note note--1">&#9834;</span>
        <span class="note note--2">&#9835;</span>
        <span class="note note--3">&#9834;</span>
      </div>
      <header class="brand">
        <div class="brand__logo" aria-hidden="true">&#9834;</div>
        <p class="brand__name">Music<span class="brand__accent">AI</span></p>
      </header>
      <section class="login-card" aria-labelledby="welcome-heading">
        <h1 id="welcome-heading" class="login-card__title">¡Bienvenido a MusicAI!</h1>
        <p class="login-card__subtitle">¡Toma la guitarra y aprende armonía practicando!</p>
        <div class="login-form">
          <a class="btn-primary" href="ingresar">Ingresar</a>
          <a class="btn-primary" href="registrar">Registrarse</a>

      </section>
    </main>
